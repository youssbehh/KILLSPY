name: Game CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: game

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: game/package-lock.json

    - name: Installation des dépendances
      run: npm ci

    - name: Vérification des types
      run: npm run typecheck

    # --ci : un snapshot manquant ou différent fait échouer le job (jamais de mise à jour silencieuse).
    - name: Tests Jest
      run: npm test -- --ci

  docker:
    needs: build
    # Les secrets Docker Hub ne sont pas disponibles sur les pull requests.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Pull de l'image existante (cache)
      run: docker pull ${{ secrets.DOCKER_USERNAME }}/killspy-app:latest || true

    - name: Construction de l'image
      run: |
        docker build --cache-from=${{ secrets.DOCKER_USERNAME }}/killspy-app:latest \
                     --build-arg EXPO_PUBLIC_API_URL=${{ vars.EXPO_PUBLIC_API_URL }} \
                     --tag ${{ secrets.DOCKER_USERNAME }}/killspy-app:latest \
                     --tag ${{ secrets.DOCKER_USERNAME }}/killspy-app:${{ github.sha }} \
                     .
      working-directory: game

    - name: Push de l'image (latest & sha)
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/killspy-app:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/killspy-app:${{ github.sha }}
