name: Api CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'
        cache-dependency-path: api/package-lock.json

    - name: Installation des dépendances
      run: npm ci

    - name: Génération du client Prisma
      run: npx prisma generate

    - name: Compilation TypeScript
      run: npm run build

    - name: Tests Jest
      run: npm test

  docker:
    needs: build
    # Les secrets Docker Hub ne sont pas disponibles sur les pull requests.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Pull de l'image existante (cache)
      run: docker pull ${{ secrets.DOCKER_USERNAME }}/killspy-api:latest || true

    - name: Construction de l'image
      run: |
        docker build --cache-from=${{ secrets.DOCKER_USERNAME }}/killspy-api:latest \
                     --tag ${{ secrets.DOCKER_USERNAME }}/killspy-api:latest \
                     --tag ${{ secrets.DOCKER_USERNAME }}/killspy-api:${{ github.sha }} \
                     .
      working-directory: api

    - name: Push de l'image (latest & sha)
      run: |
        docker push ${{ secrets.DOCKER_USERNAME }}/killspy-api:latest
        docker push ${{ secrets.DOCKER_USERNAME }}/killspy-api:${{ github.sha }}
